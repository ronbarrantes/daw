# Checks every push and pull request, builds the app for Linux, macOS and
# Windows,
# and publishes downloads:
#   - each push to main updates the rolling "latest" release, and creates a
#     versioned release (e.g. v0.2.0) for the version in Cargo.toml if there
#     isn't one yet, so bumping the version is all a release needs
#   - a v* tag pushed by hand also gets its own release
#   - each push to main also builds the web version and pushes it to the
#     web-build branch, which GitHub Pages (or Vercel) serves as-is
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - name: Install wasm-bindgen
        run: |
          # Has to match the wasm-bindgen crate the app was built with.
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep -m1 version | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$version" --locked
      - run: ./web/build.sh
      - run: touch web/dist/.nojekyll
      - uses: actions/upload-artifact@v6
        with:
          name: daw-web
          path: web/dist
          include-hidden-files: true
          if-no-files-found: error

  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # An older Ubuntu, so the binary runs on older and newer distros alike.
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: macos-14
            name: macos-arm64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Pack
        if: runner.os != 'Windows'
        run: |
          mkdir -p "dist/daw"
          cp target/release/daw README.md "dist/daw/"
          if [ "$RUNNER_OS" = Linux ]; then
            cp packaging/linux/install.sh packaging/linux/daw.desktop "dist/daw/"
            cp assets/icon-512.png "dist/daw/daw.png"
          fi
          tar -czf "daw-${{ matrix.name }}.tar.gz" -C dist daw
      - name: Build daw.app
        if: runner.os == 'macOS'
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          app=dist/app/daw.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/daw "$app/Contents/MacOS/daw"
          sed "s/@VERSION@/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          # Every icon size macOS wants, made from the 1024px PNG.
          iconset=dist/daw.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/icon.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
            double=$((size * 2))
            sips -z $double $double assets/icon.png --out "$iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/daw.icns"
          # An ad-hoc signature keeps the bundle intact in macOS's eyes; it
          # still isn't from an identified developer.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" "daw-${{ matrix.name }}.app.zip"
      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist/daw
          cp target/release/daw.exe README.md dist/daw/
          cd dist && 7z a -tzip "../daw-${{ matrix.name }}.zip" daw
      - uses: actions/upload-artifact@v6
        with:
          name: daw-${{ matrix.name }}
          path: |
            daw-${{ matrix.name }}.tar.gz
            daw-${{ matrix.name }}.app.zip
            daw-${{ matrix.name }}.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [check, package]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: Cargo.toml
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Update the "latest" release
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built automatically from main at ${GITHUB_SHA::7}."
      - name: Create a release for a new version
        if: github.ref == 'refs/heads/main'
        run: |
          version="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if gh release view "$version" > /dev/null 2>&1; then
            echo "$version is already released"
          else
            gh release create "$version" dist/* \
              --target "$GITHUB_SHA" \
              --title "$version" \
              --generate-notes
          fi
      - name: Create a versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  publish-web:
    name: Publish web version
    needs: [check, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: daw-web
          path: site
      - name: Push to the web-build branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          git init -q -b web-build
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Web build of ${GITHUB_SHA::7}"
          # Only the latest build is kept, so the branch stays small.
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" web-build
