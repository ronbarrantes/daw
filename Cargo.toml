[package]
name = "daw"
version = "0.49.0"
edition = "2021"

[dependencies]
cpal = "0.15"
eframe = "0.29"
midir = "0.11"
symphonia = { version = "0.5", features = ["mp3"] }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Puts the icon into daw.exe (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "5"
rfd = "0.15"

# The web version (see web/build.sh).
[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.15", features = ["wasm-bindgen"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AudioContext",
    "AudioContextState",
    "Blob",
    "BlobPropertyBag",
    "console",
    "Document",
    "Element",
    "EventTarget",
    "File",
    "FileList",
    "Node",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlCanvasElement",
    "Storage",
    "Url",
    "Window",
] }
