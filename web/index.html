<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>daw</title>
  <link rel="icon" href="icon.png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b1b; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #status {
      position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; color: #aaa; font: 16px system-ui, sans-serif;
    }
    #status.hidden { display: none; }
    #status.crashed {
      display: flex; background: rgba(20, 20, 20, 0.92); color: #f88;
      white-space: pre-wrap; padding: 40px; text-align: left;
      font: 14px ui-monospace, monospace;
    }
  </style>
</head>
<body>
  <canvas id="daw"></canvas>
  <div id="status">Loading daw…</div>
  <script>
    // Keep the browser from acting on daw's own shortcuts (save page,
    // reload, find, help...). The app still sees the keys.
    window.addEventListener("keydown", (e) => {
      const mod = e.ctrlKey || e.metaKey;
      const appKey = mod && ["s", "o", "g", "z", "y", "d"].includes(e.key.toLowerCase());
      const fKey = ["F1", "F5", "F6", "F7", "F8", "F9"].includes(e.key);
      if (appKey || fKey) e.preventDefault();
    }, true);
  </script>
  <script type="module">
    import init from "./daw.js";
    const status = document.getElementById("status");
    // Hidden rather than removed: it shows the reason if daw crashes.
    init().then(() => { if (!status.classList.contains("crashed")) status.className = "hidden"; }).catch((e) => {
      status.textContent = "daw couldn't start in this browser: " + e;
      console.error(e);
    });
  </script>
</body>
</html>
