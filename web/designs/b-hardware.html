<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B · Hardware</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500&amp;family=Ubuntu+Mono&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1366px; height: 768px; box-sizing: border-box; background: #121212; color: #ece8df; font-family: Ubuntu, sans-serif; font-size: 13px; display: flex; flex-direction: column">

  <!-- Top strip: a hardware-style readout -->
  <div style="height: 56px; box-sizing: border-box; padding: 0 18px; display: flex; align-items: center; gap: 18px; border-bottom: 1px solid #262626">
    <div style="display: flex; gap: 6px">
      <button style="border: 0; border-radius: 4px; padding: 7px 14px; background: #ece8df; color: #121212; font-size: 13px; font-weight: 500">JAM</button>
      <button style="border: 1px solid #3a3a3a; border-radius: 4px; padding: 7px 14px; background: transparent; color: #a8a49b; font-size: 13px">ARRANGE</button>
    </div>
    <div style="display: flex; align-items: center; gap: 0; background: #1d1d1d; border: 1px solid #2c2c2c; border-radius: 3px; padding: 6px 14px; font-family: 'Ubuntu Mono', monospace; font-size: 15px; gap: 22px">
      <span><span style="color: #7d7a73; font-size: 11px">BPM </span>100.0</span>
      <span><span style="color: #7d7a73; font-size: 11px">SWING </span>0%</span>
      <span><span style="color: #7d7a73; font-size: 11px">PAT </span>A</span>
      <span><span style="color: #7d7a73; font-size: 11px">BAR </span>1/2</span>
    </div>
    <div style="display: flex; gap: 6px">
      <button aria-label="Play" style="width: 44px; height: 36px; border: 0; border-radius: 3px; background: {{accent}}; color: #121212">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z" fill="currentColor"></path></svg>
      </button>
      <button aria-label="Record" style="width: 44px; height: 36px; border: 1px solid #3a3a3a; border-radius: 3px; background: transparent; color: #e0574a">
        <svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="currentColor"></circle></svg>
      </button>
    </div>
    <div style="display: flex; gap: 6px">
      <button style="border: 1px solid #3a3a3a; border-radius: 4px; padding: 6px 10px; background: transparent; color: #a8a49b; font-size: 12px">PATTERN</button>
      <button style="border: 1px solid #3a3a3a; border-radius: 4px; padding: 6px 10px; background: transparent; color: #a8a49b; font-size: 12px">CHAIN</button>
      <button style="border: 1px solid #3a3a3a; border-radius: 4px; padding: 6px 10px; background: transparent; color: #a8a49b; font-size: 12px">CLICK</button>
      <button style="border: 1px solid #3a3a3a; border-radius: 4px; padding: 6px 10px; background: transparent; color: #a8a49b; font-size: 12px">FX</button>
    </div>
    <div style="flex-grow: 1"></div>
    <div style="display: flex; gap: 3px; align-items: flex-end; height: 26px">
      <sc-for list="{{meter}}" as="m" hint-placeholder-count="12">
        <div style="{{m.style}}"></div>
      </sc-for>
    </div>
  </div>

  <!-- Pattern bank + chain -->
  <div style="padding: 12px 18px 4px; display: flex; align-items: center; gap: 8px">
    <sc-for list="{{bank}}" as="b" hint-placeholder-count="8">
      <button style="{{b.style}}">{{b.name}}</button>
    </sc-for>
    <div style="width: 1px; height: 24px; background: #2c2c2c; margin: 0 8px"></div>
    <span style="color: #7d7a73; font-size: 11px">CHAIN</span>
    <sc-for list="{{chain}}" as="c" hint-placeholder-count="16">
      <div style="{{c.style}}">{{c.name}}</div>
    </sc-for>
  </div>

  <!-- Big pads -->
  <div style="flex-grow: 1; padding: 10px 18px; display: flex; flex-direction: column; gap: 6px; min-height: 0">
    <sc-for list="{{tracks}}" as="t" hint-placeholder-count="6">
      <div style="display: flex; align-items: center; gap: 8px">
        <div style="{{t.tag}}"></div>
        <button style="{{t.nameStyle}}">{{t.name}}</button>
        <div style="display: flex; gap: 4px">
          <sc-for list="{{t.steps}}" as="s" hint-placeholder-count="16">
            <div style="{{s.style}}"></div>
          </sc-for>
        </div>
        <span style="color: #7d7a73; font-size: 11px; font-family: 'Ubuntu Mono', monospace; margin-left: 6px">{{t.bars}}</span>
      </div>
    </sc-for>
  </div>

  <!-- Instrument dock: sections side by side -->
  <div style="height: 236px; box-sizing: border-box; border-top: 1px solid #262626; background: #181818; padding: 12px 18px; display: flex; gap: 14px">
    <div style="width: 150px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 18px; font-weight: 500">Lead</span>
      <span style="color: #7d7a73; font-size: 12px">Synth · Grand piano</span>
      <div style="display: flex; gap: 6px; margin-top: 6px">
        <button style="border: 1px solid #3a3a3a; border-radius: 4px; padding: 6px 10px; background: transparent; color: #ece8df; font-size: 12px">DRONE</button>
        <button style="border: 1px solid #3a3a3a; border-radius: 4px; padding: 6px 10px; background: transparent; color: #ece8df; font-size: 12px">TAP</button>
      </div>
      <div style="margin-top: auto; height: 60px; border-radius: 3px; background: #101010; border: 1px solid #262626; display: flex; align-items: center; justify-content: center; color: #4f4d48; font-size: 11px">scope</div>
    </div>
    <sc-for list="{{modules}}" as="m" hint-placeholder-count="5">
      <div style="{{m.box}}">
        <div style="display: flex; align-items: center; gap: 6px">
          <span style="{{m.dot}}"></span>
          <span style="font-size: 11px; letter-spacing: 0.06em; color: #a8a49b">{{m.name}}</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 6px">
          <sc-for list="{{m.knobs}}" as="k" hint-placeholder-count="4">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 3px">
              <div style="{{k.ring}}"></div>
              <span style="font-size: 11px">{{k.name}}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#f2a33a","options":["#f2a33a","#4fc3c9","#e86a8a"]},"$preview":{"width":1366,"height":768}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#f2a33a';
    const meter = Array.from({ length: 12 }, (_, i) => ({ style: 'width: 5px; border-radius: 1px; height: ' + (6 + ((i * 7) % 20)) + 'px; background: ' + (i < 9 ? '#6fbf73' : i < 11 ? '#e0c04a' : '#3a3a3a') }));
    const bank = 'ABCDEFGH'.split('').map((n, i) => ({ name: n, style: 'width: 32px; height: 32px; border-radius: 3px; font-size: 13px; font-weight: 500; ' + (i === 0 ? 'border: 0; background: ' + accent + '; color: #121212' : i < 4 ? 'border: 1px solid #3a3a3a; background: #1d1d1d; color: #ece8df' : 'border: 1px solid #2a2a2a; background: transparent; color: #55524c') }));
    const chainSeq = 'AABAAC..........';
    const chain = chainSeq.split('').map((c) => ({ name: c === '.' ? '' : c, style: 'width: 22px; height: 22px; border-radius: 3px; font-size: 11px; display: flex; align-items: center; justify-content: center; ' + (c === '.' ? 'background: #1b1b1b; border: 1px solid #262626; box-sizing: border-box' : 'background: #2b2b2b; color: #ece8df') }));
    const rows = [
      ['Kick', 'x...x...x...x...', '#f2a33a', '1 BAR'],
      ['Snare', '....x.......x...', '#f2a33a', '1 BAR'],
      ['Hat', 'x.x.x.x.x.x.x.x.', '#f2a33a', '1 BAR'],
      ['Clave', 'x..x..x...x.x...', '#f2a33a', '2 BAR'],
      ['Lead', 'x..x..x.x...x...', '#7fb7ff', '2 BAR'],
      ['Pad', 'x...............', '#7fb7ff', '1 BAR'],
    ];
    const tracks = rows.map(([name, s, on, bars], ti) => ({
      name, bars,
      tag: 'width: 4px; height: 36px; border-radius: 2px; background: ' + on,
      nameStyle: 'width: 86px; height: 36px; border-radius: 3px; font-size: 13px; text-align: left; padding: 0 10px; ' + (ti === 4 ? 'border: 1px solid #ece8df; background: #232323; color: #fff' : 'border: 0; background: #1d1d1d; color: #ece8df'),
      steps: s.split('').map((c, i) => ({
        style: 'width: 52px; height: 36px; border-radius: 3px; box-sizing: border-box; ' + (i % 4 === 0 && i > 0 ? 'margin-left: 8px; ' : '') + (c === 'x' ? 'background: ' + on : 'background: #1d1d1d; border: 1px solid ' + (i % 4 === 0 ? '#343434' : '#262626')),
      })),
    }));
    const ring = (c) => 'width: 38px; height: 38px; border-radius: 19px; box-sizing: border-box; background: #121212; border: 3px solid ' + c;
    const mod = (name, color, knobs, linkColor) => ({
      name,
      box: 'flex: 1 1 0; min-width: 0; border-radius: 3px; padding: 10px; display: flex; flex-direction: column; gap: 10px; background: #1d1d1d; border: 1px solid ' + (linkColor ? linkColor : '#262626'),
      dot: 'width: 8px; height: 8px; border-radius: 4px; background: ' + color,
      knobs: knobs.map((k) => ({ name: k[0], ring: ring(k[1] ?? '#5a5750') })),
    });
    const modules = [
      mod('OSC', '#7fb7ff', [['Wave 1', accent], ['Wave 2'], ['Level 2'], ['Pitch 2']]),
      mod('LFO · LFO 2', '#e0913a', [['Rate', accent], ['Amount', accent], ['Wave'], ['Sync']], '#5a4020'),
      mod('FILTER', '#7fb7ff', [['Cutoff', '#e0913a'], ['Reso'], ['Env amt'], ['Decay']]),
      mod('ENVELOPE', '#7fb7ff', [['Attack', accent], ['Decay'], ['Sustain'], ['Release']]),
      mod('MOD ENV', '#c98ce6', [['Attack'], ['Decay'], ['Sustain'], ['to Bend', '#c98ce6']], '#4a3256'),
    ];
    return { accent, meter, bank, chain, tracks, modules };
  }
}
</script>
</body>
</html>
