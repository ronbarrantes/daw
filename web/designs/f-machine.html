<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>F · Machine</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500&amp;family=Ubuntu+Mono&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1366px; height: 768px; box-sizing: border-box; background: #1c1c1c; color: #cfcfcf; font-family: Ubuntu, sans-serif; font-size: 12px; display: flex; flex-direction: column; gap: 14px; padding: 16px 24px">
  <div style="display: flex; gap: 20px; flex-grow: 1; min-height: 0">
    <!-- Track keys -->
    <div style="width: 150px; display: flex; flex-direction: column; gap: 6px">
      <span style="color: #7a7a7a; font-size: 11px">Tracks</span>
      <sc-for list="{{tracks}}" as="t" hint-placeholder-count="8"><div style="{{t.style}}"><span>{{t.num}}</span><span>{{t.name}}</span></div></sc-for>
    </div>
    <!-- Screen -->
    <div style="flex-grow: 1; display: flex; flex-direction: column; background: #050505; border: 6px solid #2a2a2a; padding: 14px 18px; font-family: 'Ubuntu Mono', monospace; color: #f2f2f2">
      <div style="display: flex; justify-content: space-between; font-size: 14px">
        <span>T5 LEAD · ANALOG</span><span>PTN B · 2 BARS</span><span>96.0 BPM</span>
      </div>
      <div style="display: flex; gap: 0; margin-top: 14px; border-bottom: 1px solid #f2f2f2">
        <sc-for list="{{pages}}" as="p" hint-placeholder-count="5"><span style="{{p.style}}">{{p.name}}</span></sc-for>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px 18px; margin-top: 26px">
        <sc-for list="{{params}}" as="k" hint-placeholder-count="8">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
            <div style="{{k.ring}}"><div style="width: 44px; height: 44px; border-radius: 22px; background: #050505; display: flex; align-items: center; justify-content: center; font-size: 13px">{{k.value}}</div></div>
            <span style="font-size: 13px">{{k.name}}</span>
          </div>
        </sc-for>
      </div>
      <div style="margin-top: auto; display: flex; justify-content: space-between; color: #9a9a9a; font-size: 12px">
        <span>LFO 2 &gt; CUTOFF +40 · MOD ENV &gt; BEND -50</span><span>BAR 2/2</span>
      </div>
    </div>
    <!-- Encoders + function keys -->
    <div style="width: 230px; display: flex; flex-direction: column; gap: 14px">
      <span style="color: #7a7a7a; font-size: 11px">Data entry</span>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px">
        <sc-for list="{{encoders}}" as="e" hint-placeholder-count="8">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><div style="width: 38px; height: 38px; border-radius: 19px; background: #2e2e2e; border: 2px solid #454545; box-sizing: border-box"></div><span style="color: #7a7a7a; font-size: 10px">{{e}}</span></div>
        </sc-for>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 8px">
        <sc-for list="{{functions}}" as="f" hint-placeholder-count="6"><span style="{{f.style}}">{{f.name}}</span></sc-for>
      </div>
    </div>
  </div>
  <!-- Transport + 16 trig keys -->
  <div style="display: flex; align-items: center; gap: 10px">
    <div style="width: 150px; display: flex; gap: 6px">
      <span style="width: 44px; height: 44px; background: #2e2e2e; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z" fill="#cfcfcf"></path></svg></span>
      <span style="width: 44px; height: 44px; background: #2e2e2e; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10" fill="#cfcfcf"></rect></svg></span>
      <span style="width: 44px; height: 44px; background: #2e2e2e; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#e0574a"></circle></svg></span>
    </div>
    <sc-for list="{{trigs}}" as="t" hint-placeholder-count="16">
      <div style="{{t.box}}"><span style="{{t.led}}"></span><span style="color: #7a7a7a; font-size: 10px">{{t.num}}</span></div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1366,"height":768}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['Kick', 'Snare', 'Hat', 'Shaker', 'Lead', 'Pad', '-', '-'];
    const tracks = names.map((n, i) => ({ num: String(i + 1), name: n, style: 'height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; font-size: 13px; ' + (i === 4 ? 'background: #e8e8e8; color: #111' : n === '-' ? 'background: #232323; color: #555' : 'background: #2e2e2e; color: #cfcfcf') }));
    const pages = ['SRC', 'FLTR', 'AMP', 'LFO', 'MOD'].map((n, i) => ({ name: n, style: 'padding: 4px 18px; font-size: 13px; ' + (i === 1 ? 'background: #f2f2f2; color: #050505' : '') }));
    const ring = (p) => 'width: 58px; height: 58px; border-radius: 29px; display: flex; align-items: center; justify-content: center; background: conic-gradient(from 225deg, #f2f2f2 0 ' + p * 0.75 + '%, #333 ' + p * 0.75 + '% 75%, transparent 75%)';
    const params = [['CUTOFF', '1.2k', 52], ['RESO', '20', 20], ['ENV', '40', 40], ['DECAY', '180', 30], ['TYPE', 'LP', 0], ['KEYTRK', '50', 50], ['DRIVE', '0', 0], ['WIDTH', '100', 100]].map(([n, v, p]) => ({ name: n, value: v, ring: ring(p) }));
    const encoders = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
    const functions = ['Pattern', 'Chain', 'Copy', 'Paste', 'Bar 1', 'Bar 2'].map((n, i) => ({ name: n, style: 'height: 30px; display: flex; align-items: center; justify-content: center; ' + (i === 5 ? 'background: #e8e8e8; color: #111' : 'background: #2e2e2e') }));
    const s = 'x.....x.x..x....';
    const trigs = s.split('').map((x, i) => ({
      num: String(i + 1),
      box: 'width: 60px; height: 60px; box-sizing: border-box; background: #2e2e2e; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; ' + (i % 4 === 0 && i > 0 ? 'margin-left: 8px; ' : '') + (i === 6 ? 'outline: 2px solid #e8e8e8' : ''),
      led: 'width: 18px; height: 6px; background: ' + (x === 'x' ? '#ff6a3d' : '#3d3d3d'),
    }));
    return { tracks, pages, params, encoders, functions, trigs };
  }
}
</script>
</body>
</html>
