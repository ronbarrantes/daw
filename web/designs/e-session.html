<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>E · Session</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500&amp;family=Ubuntu+Mono&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1366px; height: 768px; box-sizing: border-box; background: #3a3a3a; color: #e0e0e0; font-family: Ubuntu, sans-serif; font-size: 11px; display: flex; flex-direction: column">
  <!-- Control bar: transport centered -->
  <div style="height: 30px; display: flex; align-items: center; padding: 0 8px; gap: 8px; background: #2e2e2e; border-bottom: 1px solid #1e1e1e">
    <span style="background: #4a4a4a; padding: 3px 6px">96.00</span><span style="background: #4a4a4a; padding: 3px 6px">4 / 4</span><span style="color: #9a9a9a">Swing 12%</span>
    <div style="flex-grow: 1"></div>
    <span style="width: 22px; height: 18px; background: #4a4a4a; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="9" height="9" viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z" fill="#e0e0e0"></path></svg></span>
    <span style="width: 22px; height: 18px; background: #4a4a4a; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="9" height="9" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10" fill="#e0e0e0"></rect></svg></span>
    <span style="width: 22px; height: 18px; background: #4a4a4a; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="9" height="9" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#e0574a"></circle></svg></span>
    <span style="background: #4a4a4a; padding: 3px 8px; font-family: 'Ubuntu Mono', monospace">3. 2. 1</span>
    <div style="flex-grow: 1"></div>
    <span style="background: #ffb84d; color: #222; padding: 3px 8px">Jam</span><span style="background: #4a4a4a; padding: 3px 8px">Arrange</span>
  </div>
  <div style="flex-grow: 1; display: flex; min-height: 0">
    <!-- Browser -->
    <div style="width: 160px; background: #2f2f2f; border-right: 1px solid #1e1e1e; padding: 6px 0">
      <div style="padding: 2px 8px; color: #9a9a9a">Patterns</div>
      <sc-for list="{{patterns}}" as="p" hint-placeholder-count="5"><div style="{{p.row}}">{{p.name}}</div></sc-for>
      <div style="padding: 10px 8px 2px; color: #9a9a9a">Sounds</div>
      <sc-for list="{{sounds}}" as="s" hint-placeholder-count="6"><div style="padding: 2px 14px; color: #c8c8c8">{{s}}</div></sc-for>
    </div>
    <!-- Grid: two bars side by side -->
    <div style="flex-grow: 1; min-width: 0; background: #3a3a3a; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px">
      <div style="display: flex; padding-left: 132px; color: #9a9a9a; font-family: 'Ubuntu Mono', monospace"><span style="width: 474px">1</span><span>2</span></div>
      <sc-for list="{{tracks}}" as="t" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 2px">
          <span style="{{t.name}}">{{t.label}}</span>
          <span style="width: 16px; height: 22px; background: #ffb84d; color: #222; display: flex; align-items: center; justify-content: center; margin-right: 6px">{{t.num}}</span>
          <sc-for list="{{t.steps}}" as="s" hint-placeholder-count="32"><div style="{{s}}"></div></sc-for>
        </div>
      </sc-for>
    </div>
  </div>
  <!-- Detail view: device chain left to right, info box -->
  <div style="height: 236px; display: flex; background: #2e2e2e; border-top: 2px solid #1e1e1e">
    <div style="width: 160px; box-sizing: border-box; padding: 8px; border-right: 1px solid #1e1e1e; color: #b8b8b8; line-height: 1.5">
      <div style="color: #e0e0e0; margin-bottom: 4px">Cutoff</div>
      Sets how bright the sound is. LFO 2 moves it (orange ring). Drag up or down; double-click to reset.
    </div>
    <div style="flex-grow: 1; display: flex; gap: 4px; padding: 6px; overflow: hidden">
      <sc-for list="{{devices}}" as="d" hint-placeholder-count="5">
        <div style="{{d.box}}">
          <div style="height: 18px; display: flex; align-items: center; gap: 6px; padding: 0 6px; background: #4a4a4a">
            <span style="width: 9px; height: 9px; background: #ffb84d"></span><span>{{d.name}}</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 2px; padding: 10px 4px">
            <sc-for list="{{d.knobs}}" as="k" hint-placeholder-count="3">
              <div style="display: flex; flex-direction: column; align-items: center; gap: 3px">
                <span style="color: #b8b8b8">{{k.name}}</span>
                <div style="{{k.ring}}"><div style="width: 22px; height: 22px; border-radius: 11px; background: #2e2e2e"></div></div>
                <span style="font-family: 'Ubuntu Mono', monospace; color: #9a9a9a">{{k.value}}</span>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1366,"height":768}}'>
class Component extends DCLogic {
  renderVals() {
    const patterns = ['Intro', 'Beat', 'Beat 2', 'Fill', 'Break'].map((n, i) => ({ name: n, row: 'padding: 2px 14px; ' + (i === 1 ? 'background: #5a5a5a; color: #fff' : 'color: #c8c8c8') }));
    const sounds = ['Kick', 'Snare', 'Timbale hi', 'Grand piano', 'Laser', 'Sample...'];
    const rows = [['Kick', 'x..x..x...x..x..x..x..x...x..x.x', '#ff9a5c'], ['Snare', '....x..x....x.......x..x....x.xx', '#ffd166'], ['Hat', 'xxx.xxx.xxx.xx.xxxx.xxx.xxx.xx.x', '#c9e265'], ['Shaker', '..x...x...x...x...x...x...x...x.', '#6ad1b3'], ['Lead', 'x.....x.x..x....x.....x...x.x...', '#7fb3ff'], ['Pad', 'x.......x.......x...............', '#c39bf2']];
    const tracks = rows.map(([label, s, c], ti) => ({
      label, num: String(ti + 1),
      name: 'width: 110px; height: 22px; display: flex; align-items: center; padding: 0 6px; color: #1e1e1e; background: ' + c + (ti === 4 ? '; outline: 1px solid #fff' : ''),
      steps: s.split('').map((x, i) => 'width: 26px; height: 22px; box-sizing: border-box; ' + (i === 16 ? 'margin-left: 10px; ' : i % 4 === 0 && i > 0 ? 'margin-left: 3px; ' : '') + 'background: ' + (x === 'x' ? c : '#4c4c4c')),
    }));
    const ring = (p, c) => 'width: 30px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; background: conic-gradient(from 225deg, ' + (c || '#e0e0e0') + ' 0 ' + p * 0.75 + '%, #555 ' + p * 0.75 + '% 75%, transparent 75%)';
    const dev = (name, w, knobs) => ({ name, box: 'width: ' + w + 'px; flex-shrink: 0; background: #3a3a3a; border: 1px solid #1e1e1e', knobs: knobs.map(([n, v, p, c]) => ({ name: n, value: v, ring: ring(p, c) })) });
    const devices = [
      dev('Lead · Analog', 210, [['Wave 1', 'Saw', 50], ['Wave 2', 'Sqr', 75], ['Level 2', '40%', 40], ['Detune', '12%', 12], ['Glide', '0 ms', 0], ['Bend', '-0.5', 46, '#c39bf2']]),
      dev('Filter', 150, [['Cutoff', '1.2k', 52, '#ff9a5c'], ['Reso', '20%', 20], ['Env', '40%', 40]]),
      dev('Envelope', 210, [['Attack', '3 ms', 2], ['Decay', '300', 35], ['Sustain', '60%', 60], ['Release', '200', 25]]),
      dev('LFO 2', 150, [['Rate', '1/8', 55], ['Amount', '35%', 35], ['Wave', 'Sine', 0]]),
      dev('Mod env', 150, [['Attack', '10 ms', 5], ['Decay', '400', 40], ['Amount', '-50', 50]]),
    ];
    return { patterns, sounds, tracks, devices };
  }
}
</script>
</body>
</html>
