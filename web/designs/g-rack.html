<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>G · Rack</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500&amp;family=Ubuntu+Mono&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1366px; height: 768px; box-sizing: border-box; background: #34393d; color: #d4d8db; font-family: Ubuntu, sans-serif; font-size: 12px; display: flex; flex-direction: column">
  <!-- Toolbar -->
  <div style="height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 10px; background: #2a2e31; border-bottom: 1px solid #1c1f21">
    <span style="color: #9aa3a8">File Edit View Help</span>
    <div style="width: 1px; height: 22px; background: #1c1f21"></div>
    <span style="background: #4d5a3a; color: #dff0b8; padding: 4px 10px">PAT</span><span style="background: #3d4347; padding: 4px 10px">SONG</span>
    <span style="width: 30px; height: 26px; background: #3d4347; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z" fill="#d4d8db"></path></svg></span>
    <span style="width: 30px; height: 26px; background: #3d4347; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#e0574a"></circle></svg></span>
    <span style="background: #16191b; color: #9ee0a0; font-family: 'Ubuntu Mono', monospace; font-size: 15px; padding: 3px 10px">96.000</span>
    <span style="background: #16191b; color: #9ee0a0; font-family: 'Ubuntu Mono', monospace; font-size: 15px; padding: 3px 10px">3:02:01</span>
    <span style="background: #3d4347; padding: 4px 10px">Pattern: Beat</span>
    <div style="flex-grow: 1"></div>
    <span style="color: #9aa3a8">CPU 7%</span>
  </div>
  <div style="flex-grow: 1; display: flex; min-height: 0">
    <!-- Channel rack -->
    <div style="flex-grow: 1; min-width: 0; padding: 10px; display: flex; flex-direction: column; gap: 4px">
      <div style="height: 24px; display: flex; align-items: center; gap: 8px; padding: 0 6px; background: #2a2e31; color: #9aa3a8">Channel rack · Beat (2 bars)</div>
      <sc-for list="{{channels}}" as="c" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 4px">
          <span style="{{c.led}}"></span>
          <div style="width: 26px; height: 20px; border-radius: 10px; background: #2a2e31; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #9aa3a8">{{c.pan}}</div>
          <span style="{{c.name}}">{{c.label}}</span>
          <sc-for list="{{c.steps}}" as="s" hint-placeholder-count="32"><div style="{{s}}"></div></sc-for>
        </div>
      </sc-for>
      <div style="display: flex; gap: 6px; margin-top: 4px"><span style="background: #3d4347; padding: 4px 12px">+ Channel</span></div>
    </div>
    <!-- Mini playlist -->
    <div style="width: 230px; background: #2e3236; border-left: 1px solid #1c1f21; display: flex; flex-direction: column">
      <div style="height: 24px; display: flex; align-items: center; padding: 0 8px; background: #2a2e31; color: #9aa3a8">Playlist</div>
      <sc-for list="{{lanes}}" as="l" hint-placeholder-count="4">
        <div style="height: 28px; display: flex; align-items: center; gap: 2px; padding: 0 4px; border-bottom: 1px solid #262a2d">
          <sc-for list="{{l}}" as="b" hint-placeholder-count="6"><div style="{{b.style}}">{{b.name}}</div></sc-for>
        </div>
      </sc-for>
    </div>
  </div>
  <!-- Docked channel settings (no floating windows) -->
  <div style="height: 214px; display: flex; background: #2a2e31; border-top: 2px solid #1c1f21">
    <div style="width: 190px; padding: 10px; border-right: 1px solid #1c1f21; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 14px; color: #8fc4ff">Lead</span>
      <span style="color: #9aa3a8">Analog · Plucky lead</span>
      <div style="display: flex; gap: 4px; margin-top: 4px"><span style="background: #3d4347; padding: 3px 10px">Drone</span><span style="background: #3d4347; padding: 3px 10px">Tap</span></div>
    </div>
    <sc-for list="{{panels}}" as="p" hint-placeholder-count="5">
      <div style="width: 170px; padding: 10px; border-right: 1px solid #1c1f21; display: flex; flex-direction: column; gap: 8px">
        <span style="color: #b5bcc0">{{p.name}}</span>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 2px">
          <sc-for list="{{p.knobs}}" as="k" hint-placeholder-count="3">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 3px">
              <div style="{{k.ring}}"><div style="width: 24px; height: 24px; border-radius: 12px; background: #4a5156"></div></div>
              <span style="font-size: 10px; color: #9aa3a8">{{k.name}}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1366,"height":768}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [['Kick', 'x..x..x...x..x..x..x..x...x..x.x', 'C'], ['Snare', '....x..x....x.......x..x....x.xx', 'C'], ['Hat', 'xxx.xxx.xxx.xx.xxxx.xxx.xxx.xx.x', 'L'], ['Shaker', '..x...x...x...x...x...x...x...x.', 'R'], ['Lead', 'x.....x.x..x....x.....x...x.x...', 'C'], ['Pad', 'x.......x.......x...............', 'C']];
    const channels = rows.map(([label, s, pan], ti) => ({
      label, pan,
      led: 'width: 8px; height: 14px; background: ' + (ti === 3 ? '#4a5156' : '#8fe05a'),
      name: 'width: 104px; height: 24px; display: flex; align-items: center; padding: 0 8px; ' + (ti === 4 ? 'background: #5b6a75; color: #fff' : 'background: #454c51'),
      steps: s.split('').map((x, i) => 'width: 22px; height: 24px; box-sizing: border-box; ' + (i === 16 ? 'margin-left: 8px; ' : '') + 'background: ' + (x === 'x' ? '#e8eef1' : Math.floor(i / 4) % 2 ? '#5a3f42' : '#454c51') + '; border: 1px solid #2a2e31'),
    }));
    const blk = (n, w, c) => ({ name: n, style: 'width: ' + w + 'px; height: 20px; font-size: 10px; padding: 0 3px; overflow: hidden; color: #1c1f21; background: ' + c });
    const lanes = [[blk('Intro', 40, '#9fb6c9'), blk('Beat', 80, '#c2a9df'), blk('Beat', 80, '#c2a9df')], [blk('', 40, 'transparent'), blk('Fill', 40, '#e0b07a'), blk('Break', 80, '#9fd3a8')], [blk('Pad notes', 200, '#8fc4ff')], []];
    const ring = (p, c) => 'width: 30px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; background: conic-gradient(from 225deg, ' + (c || '#d4d8db') + ' 0 ' + p * 0.75 + '%, #1c1f21 ' + p * 0.75 + '% 75%, transparent 75%)';
    const panel = (name, knobs) => ({ name, knobs: knobs.map(([n, p, c]) => ({ name: n, ring: ring(p, c) })) });
    const panels = [
      panel('Oscillators', [['Wave 1', 50], ['Wave 2', 75], ['Level 2', 40], ['Pitch 2', 50], ['Detune', 12], ['Bend', 46, '#c2a9df']]),
      panel('Filter', [['Cutoff', 52, '#e0b07a'], ['Reso', 20], ['Env', 40]]),
      panel('Envelope', [['Attack', 2], ['Decay', 35], ['Sustain', 60], ['Release', 25]]),
      panel('LFO 2', [['Rate', 55], ['Amount', 35], ['Wave', 0]]),
      panel('Mod env', [['Attack', 5], ['Decay', 40], ['Amount', 50]]),
    ];
    return { channels, lanes, panels };
  }
}
</script>
</body>
</html>
